<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RE-Suite: 신뢰성 공학 분석 도구. Weibull 분석, 시료수 계획, 가속 수명 시험, Warranty 분석을 브라우저에서 직접 수행합니다.">
    <title>REA — Reliability Engineering Analytics</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- KaTeX (수식 렌더링) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Chart.js & Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

    <!-- jStat (통계 분포) -->
    <script src="https://cdn.jsdelivr.net/npm/jstat@1.9.6/dist/jstat.min.js"></script>

    <!-- SheetJS (Excel 파싱) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Handsontable CE (데이터 그리드) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@14.3.0/dist/handsontable.full.min.css">
    <script src="https://cdn.jsdelivr.net/npm/handsontable@14.3.0/dist/handsontable.full.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="css/main.css?v=3">
</head>
<body>
    <div class="container" id="app">
        <!-- ═══ Header ═══ -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                    </svg>
                </div>
                <div>
                    <h1 class="app-title">REA</h1>
                    <span class="app-subtitle">Reliability Engineering Analytics</span>
                </div>
            </div>
            <div class="header-right">
                <button id="theme-toggle-btn" class="btn btn-secondary" onclick="toggleTheme()" style="min-height: 32px; height: 32px; padding: 0 0.75rem; font-size: 0.78rem; display: flex; align-items: center; gap: 0.35rem; border-radius: 6px; cursor: pointer;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 14.7255 3.09032 17.1962 4.85857 19C5.32626 19.475 6.00282 19.6136 6.61331 19.349C7.22379 19.0844 7.625 18.475 7.625 17.8125C7.625 16.5367 8.66173 15.5 9.9375 15.5H11.5C12.3284 15.5 13 16.1716 13 17V20.5C13 21.3284 12.3284 22 11.5 22H12Z"/>
                        <circle cx="7.5" cy="10.5" r="1.5" fill="currentColor"/>
                        <circle cx="11.5" cy="7.5" r="1.5" fill="currentColor"/>
                        <circle cx="16.5" cy="9.5" r="1.5" fill="currentColor"/>
                    </svg>
                    <span id="theme-btn-text">Black 테마</span>
                </button>
            </div>
        </header>

        <!-- ═══ Desktop Tab Navigation ═══ -->
        <nav class="tab-nav tab-nav-desktop" id="tab-nav">
            <button class="tab-btn active" data-tab="planning" onclick="switchTab('planning')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h8M8 14h4"/></svg>
                <span class="tab-label-desktop">시료수 계획</span><span class="tab-label-mobile">시료수</span>
            </button>
            <button class="tab-btn" data-tab="acceleration" onclick="switchTab('acceleration')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                <span class="tab-label-desktop">가속 수명 시험</span><span class="tab-label-mobile">가속수명</span>
            </button>
            <button class="tab-btn" data-tab="analysis" onclick="switchTab('analysis')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
                <span class="tab-label-desktop">신뢰성 분석</span><span class="tab-label-mobile">신뢰성 분석</span>
            </button>
            <button class="tab-btn" data-tab="warranty" onclick="switchTab('warranty')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span class="tab-label-desktop">Warranty 분석</span><span class="tab-label-mobile">보증 분석</span>
            </button>
            <button class="tab-btn" data-tab="degradation" onclick="switchTab('degradation')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>
                <span class="tab-label-desktop">열화 분석</span><span class="tab-label-mobile">열화 분석</span>
            </button>
        </nav>

        <!-- ═══ Tab Content Area ═══ -->
        <main id="tab-content">
            <!-- 각 탭의 콘텐츠는 JS에서 동적으로 렌더링 -->
        </main>
    </div>



    <!-- ═══ JS Modules ═══ -->
    <script src="js/core/constants.js?v=3"></script>
    <script src="js/core/math-engine.js?v=3"></script>
    <script src="js/core/distributions.js?v=3"></script>
    <script src="js/core/statistics.js?v=3"></script>
    <script src="js/ui/help-tooltip.js?v=3"></script>
    <script src="js/ui/formula-renderer.js?v=3"></script>
    <script src="js/ui/chart-manager.js?v=3"></script>
    <script src="js/modules/sample-planning.js?v=3"></script>
    <script src="js/modules/aql-standards.js?v=5"></script>
    <script src="js/modules/acceleration.js?v=3"></script>
    <script src="js/modules/warranty.js?v=5"></script>
    <script src="js/modules/degradation.js?v=2"></script>
    <script src="js/modules/reliability-analysis.js?v=7"></script>
    <script src="js/app.js?v=10"></script>
</body>
</html>
